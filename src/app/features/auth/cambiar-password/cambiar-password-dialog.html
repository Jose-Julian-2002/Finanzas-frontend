<p-dialog [visible]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true" [header]="titulo"
  [style]="{ width: '420px' }" [closable]="!bloqueante" [closeOnEscape]="!bloqueante"
  [dismissableMask]="!bloqueante" [draggable]="false" [blockScroll]="true">

  <p-message severity="warn" *ngIf="bloqueante"
    text="Estás usando la contraseña inicial. Defina una nueva clave para continuar."
    [style]="{ 'margin-bottom': '16px', 'display': 'block' }"></p-message>

  <p-message severity="error" [text]="errorMessage()" *ngIf="errorMessage()"
    [style]="{ 'margin-bottom': '16px', 'display': 'block' }"></p-message>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="dialog-form">
    <div class="field">
      <label for="pwdActual">Contraseña actual</label>
      <p-password id="pwdActual" formControlName="passwordActual" [feedback]="false" [toggleMask]="true"
        styleClass="w-full" inputStyleClass="w-full" autocomplete="current-password"></p-password>
      <small class="field-error" *ngIf="passwordActual?.invalid && passwordActual?.touched">
        Ingrese su contraseña actual.
      </small>
    </div>

    <div class="field">
      <label for="pwdNueva">Contraseña nueva</label>
      <p-password id="pwdNueva" formControlName="passwordNueva" [feedback]="false" [toggleMask]="true"
        styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
      <small class="field-error" *ngIf="passwordNueva?.invalid && passwordNueva?.touched">
        La nueva contraseña debe tener al menos 6 caracteres.
      </small>
    </div>

    <div class="field">
      <label for="pwdConfirmar">Confirmar contraseña nueva</label>
      <p-password id="pwdConfirmar" formControlName="confirmar" [feedback]="false" [toggleMask]="true"
        styleClass="w-full" inputStyleClass="w-full" autocomplete="new-password"></p-password>
      <small class="field-error" *ngIf="confirmar?.invalid && confirmar?.touched">
        <ng-container *ngIf="confirmar?.hasError('required')">Repita la contraseña nueva.</ng-container>
        <ng-container *ngIf="confirmar?.hasError('passwordsDistintas')">Las contraseñas no coinciden.</ng-container>
      </small>
    </div>

    <div class="dialog-actions">
      <p-button *ngIf="!bloqueante" label="Cancelar" severity="secondary" [outlined]="true" type="button"
        (onClick)="cerrar()"></p-button>
      <p-button label="Guardar contraseña" icon="pi pi-key" type="submit" [loading]="isLoading()"
        [disabled]="form.invalid || isLoading()"></p-button>
    </div>
  </form>
</p-dialog>
