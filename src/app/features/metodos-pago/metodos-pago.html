<div class="page">
  <div class="page-header">
    <div>
      <h1>Metodos de pago</h1>
      <p class="page-subtitle">Formas de cobro disponibles al registrar un recibo.</p>
    </div>
    <p-button *ngIf="puedeCrear" label="Nuevo metodo" icon="pi pi-plus" (onClick)="abrirCrear()"></p-button>
  </div>

  <p-table [value]="metodos()" [loading]="cargando()" dataKey="id" styleClass="tabla-lista">

    <ng-template #header>
      <tr>
        <th>Metodo</th>
        <th class="tabular">Pagos registrados</th>
        <th class="col-acciones">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-metodo>
      <tr>
        <td class="celda-nombre">{{ metodo.nombre }}</td>
        <td class="tabular">{{ metodo.totalPagos }}</td>
        <td class="col-acciones">
          <div class="acciones">
            <p-button *ngIf="puedeEditar" icon="pi pi-pencil" severity="secondary" [text]="true"
              [rounded]="true" pTooltip="Editar" tooltipPosition="top" ariaLabel="Editar metodo de pago"
              (onClick)="abrirEditar(metodo)"></p-button>

            <p-button icon="pi pi-eye" severity="secondary" [text]="true" [rounded]="true" pTooltip="Ver detalle"
              tooltipPosition="top" ariaLabel="Ver detalle del metodo" (onClick)="abrirDetalle(metodo)"></p-button>

            <p-button *ngIf="puedeEliminar" icon="pi pi-trash" severity="danger" [text]="true" [rounded]="true"
              [disabled]="metodo.totalPagos > 0" pTooltip="Eliminar" tooltipPosition="top"
              ariaLabel="Eliminar metodo de pago" (onClick)="confirmarEliminar(metodo)"></p-button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3">
          <div class="estado-vacio">
            <i class="pi pi-inbox"></i>
            <p>No se encontraron metodos de pago.</p>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<app-metodo-pago-form-dialog [visible]="formVisible()" (visibleChange)="formVisible.set($event)"
  [metodo]="metodoEditando()" (guardado)="alGuardar()"></app-metodo-pago-form-dialog>

<p-dialog header="Detalle del metodo de pago" [visible]="detalleVisible()"
  (visibleChange)="detalleVisible.set($event)" [modal]="true" [style]="{ width: '30rem' }" [draggable]="false">
  <ng-container *ngIf="detalleCargando()">
    <div class="estado-vacio">
      <i class="pi pi-spin pi-spinner"></i>
      <p>Cargando metodo...</p>
    </div>
  </ng-container>

  <ng-container *ngIf="!detalleCargando() && metodoDetalle() as metodo">
    <div class="detalle-lista">
      <div class="detalle-fila">
        <span class="detalle-label">Metodo</span>
        <span class="detalle-valor">{{ metodo.nombre }}</span>
      </div>
      <div class="detalle-fila">
        <span class="detalle-label">Pagos registrados</span>
        <span class="detalle-valor tabular">{{ metodo.totalPagos }}</span>
      </div>
    </div>
  </ng-container>
</p-dialog>
