<div class="app-shell">
  <div class="sidebar">
    <a class="brand" routerLink="/">
      <span class="brand-logo"><i class="pi pi-wallet"></i></span>
      <span class="brand-name">Finanzas Manager</span>
    </a>

    <nav class="side-nav" aria-label="Secciones">
      <div class="nav-section" *ngFor="let section of navVisible">
        <p class="nav-section-title">{{ section.titulo }}</p>

        <a *ngFor="let item of section.items" [routerLink]="item.ruta" routerLinkActive="active"
          class="nav-item">
          <i [class]="item.icono"></i>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <div class="side-footer">
      <div class="side-user">
        <p-avatar [label]="authService.inicialUsuario()" shape="circle" styleClass="user-avatar">
        </p-avatar>

        <div class="side-user-meta">
          <span class="side-user-name">{{ authService.nombre() }}</span>
          <span class="side-user-rol">{{ authService.rol() }}</span>
        </div>
      </div>

      <div class="side-actions">
        <button type="button" class="tema-btn" (click)="themeService.alternar()"
          [attr.aria-label]="themeService.etiquetaTema()" [pTooltip]="themeService.etiquetaTema()"
          tooltipPosition="top">
          <i [class]="themeService.iconoTema()"></i>
        </button>

        <p-button icon="pi pi-sign-out" severity="secondary" [outlined]="true"
          styleClass="logout-btn" ariaLabel="Cerrar sesion" [rounded]="true"
          (onClick)="confirmarLogout()"></p-button>
      </div>
    </div>
  </div>

  <div class="app-main">
    <header class="topbar">
      <button type="button" class="menu-btn" (click)="drawerVisible.set(true)"
        aria-label="Abrir menu de navegacion" pTooltip="Menu" tooltipPosition="bottom">
        <i class="pi pi-bars"></i>
      </button>

      <span class="brand-name brand-mobile">Finanzas Manager</span>
    </header>

    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<p-drawer [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)" position="left"
  styleClass="nav-drawer" [blockScroll]="true">
  <ng-template #header>
    <div class="drawer-header">
      <span class="brand-logo"><i class="pi pi-wallet"></i></span>
      <span class="drawer-title">Finanzas Manager</span>
    </div>
  </ng-template>

  <nav class="drawer-links" aria-label="Secciones">
    <ng-container *ngFor="let section of navVisible">
      <p class="nav-section-title">{{ section.titulo }}</p>

      <a *ngFor="let item of section.items" [routerLink]="item.ruta" routerLinkActive="active"
        (click)="drawerVisible.set(false)">
        <i [class]="item.icono"></i>
        <span>{{ item.label }}</span>
      </a>
    </ng-container>
  </nav>

  <ng-template #footer>
    <div class="drawer-footer">
      <p-button label="Cerrar sesion" icon="pi pi-sign-out" severity="secondary" [outlined]="true"
        [fluid]="true" (onClick)="confirmarLogout()"></p-button>
    </div>
  </ng-template>
</p-drawer>

<p-toast position="bottom-right"></p-toast>
<p-confirmdialog></p-confirmdialog>

<app-cambiar-password-dialog
  [visible]="passwordDialogVisible()"
  (visibleChange)="passwordDialogVisible.set($event)"
  [usuarioId]="1"
  [titulo]="authService.debeCambiarPasswordInicial() ? 'Cambie su contrasena inicial' : 'Cambiar contrasena'"
  [bloqueante]="authService.debeCambiarPasswordInicial()">
</app-cambiar-password-dialog>
