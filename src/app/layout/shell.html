<div class="app-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <button type="button" class="menu-btn" (click)="drawerVisible.set(true)"
        aria-label="Abrir menu de navegacion" pTooltip="Menu" tooltipPosition="bottom">
        <i class="pi pi-bars"></i>
      </button>

      <a class="brand" routerLink="/">
        <span class="brand-logo"><i class="pi pi-wallet"></i></span>
        <span class="brand-name">Finanzas Manager</span>
      </a>

      <nav class="nav-links" aria-label="Secciones">
        <a routerLink="/clientes" routerLinkActive="active" *ngIf="puedeVerClientes">
          <i class="pi pi-users"></i>
          <span>Clientes</span>
        </a>
        <a routerLink="/propiedades" routerLinkActive="active" *ngIf="puedeVerPropiedades">
          <i class="pi pi-building"></i>
          <span>Propiedades</span>
        </a>
        <a routerLink="/tipos-propiedad" routerLinkActive="active" *ngIf="puedeVerTiposPropiedad">
          <i class="pi pi-tags"></i>
          <span>Tipos</span>
        </a>
        <a routerLink="/usuarios" routerLinkActive="active" *ngIf="puedeVerUsuarios">
          <i class="pi pi-id-card"></i>
          <span>Usuarios</span>
        </a>
        <a routerLink="/roles" routerLinkActive="active" *ngIf="puedeVerRoles">
          <i class="pi pi-shield"></i>
          <span>Roles</span>
        </a>
      </nav>

      <div class="user-area">
        <p-button label="Salir" icon="pi pi-sign-out" severity="secondary" [outlined]="true"
          styleClass="logout-btn" ariaLabel="Cerrar sesion" (onClick)="confirmarLogout()"></p-button>

        <button type="button" class="tema-btn" (click)="themeService.alternar()"
          [attr.aria-label]="themeService.etiquetaTema()" [pTooltip]="themeService.etiquetaTema()"
          tooltipPosition="bottom">
          <i [class]="themeService.iconoTema()"></i>
        </button>

        <div class="user-meta">
          <span class="user-name">{{ authService.nombre() }}</span>
          <span class="user-rol">{{ authService.rol() }}</span>
        </div>

        <p-avatar [label]="authService.inicialUsuario()" shape="circle" styleClass="user-avatar"></p-avatar>
      </div>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>

<p-drawer [visible]="drawerVisible()" (visibleChange)="drawerVisible.set($event)" position="left"
  styleClass="nav-drawer" [blockScroll]="true">
  <ng-template #header>
    <div class="drawer-header">
      <span class="brand-logo"><i class="pi pi-wallet"></i></span>
      <span class="drawer-title">Finanzas Manager</span>
    </div>
  </ng-template>

  <nav class="drawer-links" aria-label="Secciones">
    <a routerLink="/clientes" routerLinkActive="active" *ngIf="puedeVerClientes"
      (click)="drawerVisible.set(false)">
      <i class="pi pi-users"></i>
      <span>Clientes</span>
    </a>
    <a routerLink="/propiedades" routerLinkActive="active" *ngIf="puedeVerPropiedades"
      (click)="drawerVisible.set(false)">
      <i class="pi pi-building"></i>
      <span>Propiedades</span>
    </a>
    <a routerLink="/tipos-propiedad" routerLinkActive="active" *ngIf="puedeVerTiposPropiedad"
      (click)="drawerVisible.set(false)">
      <i class="pi pi-tags"></i>
      <span>Tipos de propiedad</span>
    </a>
    <a routerLink="/usuarios" routerLinkActive="active" *ngIf="puedeVerUsuarios"
      (click)="drawerVisible.set(false)">
      <i class="pi pi-id-card"></i>
      <span>Usuarios</span>
    </a>
    <a routerLink="/roles" routerLinkActive="active" *ngIf="puedeVerRoles" (click)="drawerVisible.set(false)">
      <i class="pi pi-shield"></i>
      <span>Roles</span>
    </a>
  </nav>

  <ng-template #footer>
    <div class="drawer-footer">
      <p-button label="Cerrar sesion" icon="pi pi-sign-out" severity="secondary" [outlined]="true"
        [fluid]="true" (onClick)="confirmarLogout()"></p-button>
    </div>
  </ng-template>
</p-drawer>

<p-toast position="bottom-right"></p-toast>
<p-confirmdialog></p-confirmdialog>

<app-cambiar-password-dialog
  [visible]="passwordDialogVisible()"
  (visibleChange)="passwordDialogVisible.set($event)"
  [usuarioId]="1"
  [titulo]="authService.debeCambiarPasswordInicial() ? 'Cambie su contrasena inicial' : 'Cambiar contrasena'"
  [bloqueante]="authService.debeCambiarPasswordInicial()">
</app-cambiar-password-dialog>
